<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RUBICON PROTOCOL — 模型庫</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
:root{--bg: #0c1016;--cell: #161b22;--ink: #e6edf3;--dim: #8a97a6;--line: #2a3644;--acc: #ffb020;--acc2: #5cc8ff;--ok: #7ee081;--warn: #ffb020;--bad: #ff4d4d;--panel: rgba(10, 14, 20, .92)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Chakra Petch,Noto Sans TC,system-ui,sans-serif;font-size:14px}.dim{color:var(--dim)}#gridGl{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0}#top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px 0;backdrop-filter:blur(6px)}.brand{font-size:18px}.brand b{color:var(--acc);letter-spacing:.1em}.brand .dim{font-size:12px;margin-left:10px}.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0}input,select,button{font:inherit;color:var(--ink);background:#ffffff0d;border:1px solid var(--line);padding:5px 10px}button{cursor:pointer}button:hover,button.sel{border-color:var(--acc);color:var(--acc)}#search{flex:1;min-width:160px;max-width:360px}#tabs{display:flex;gap:2px;overflow-x:auto;white-space:nowrap}#tabs button{border:none;border-bottom:2px solid transparent;background:none;padding:6px 10px}#tabs button.sel{border-bottom-color:var(--acc)}#tabs button .n{font-size:11px;color:var(--dim);margin-left:4px}#grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px 16px 40px}@media(max-width:960px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){#grid{grid-template-columns:minmax(0,1fr)}}.cell{border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column}.cell:hover{border-color:var(--acc2)}.cell .view{aspect-ratio:4 / 3;position:relative}.cell .view .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:12px}.cell .meta{background:var(--panel);padding:7px 10px;border-top:1px solid var(--line);font-size:12px;line-height:1.5}.cell .meta .t{display:flex;gap:6px;align-items:center}.cell .meta b{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:10px;padding:1px 6px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}.badge.glb{border-color:var(--acc2);color:var(--acc2)}.badge.warn{border-color:var(--warn);color:var(--warn)}.badge.bad{border-color:var(--bad);color:var(--bad)}.size{color:var(--ink);font-weight:600}.size small{color:var(--dim);font-weight:400}#inspect{position:fixed;inset:0;z-index:20;display:flex;background:var(--bg)}#inspect[hidden]{display:none}#insView{flex:1;position:relative;min-width:0}#insGl{width:100%;height:100%;display:block}#insLabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.lbl{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:700;white-space:nowrap;padding:1px 5px;background:#0a0e14bf;border:1px solid var(--line)}.lbl.dimL{color:var(--acc);border-color:var(--acc)}.lbl.tick{font-size:10px;font-weight:400;color:var(--ink);background:#0a0e1499;border:none;transform:translate(-100%,-50%);padding-right:6px}.lbl.human{font-size:10px;color:var(--dim)}#insClose{position:absolute;top:10px;left:10px;font-size:16px;padding:4px 12px;background:var(--panel)}#insSide{width:min(360px,38vw);overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:14px 16px}#insSide h2{margin:0 0 2px;font-size:18px}#insSide h3{font-size:13px;margin:14px 0 6px;color:var(--acc2)}.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:12px}.kv span:last-child{font-weight:600;text-align:right}.toggles{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px}.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px}.btns{display:flex;flex-wrap:wrap;gap:6px}.btns button{font-size:12px;padding:4px 10px}@media(max-width:760px){#inspect{flex-direction:column}#insView{flex:none;height:58vh}#insSide{width:auto;flex:1;border-left:none;border-top:1px solid var(--line)}}.hint{font-size:11px}.cell .dropHint{position:absolute;inset:0;display:none;place-items:center;font-weight:700;color:var(--acc2);background:#5cc8ff1f;border:2px dashed var(--acc2)}.cell.drop .dropHint{display:grid}.small{font-size:11px;margin-top:4px}#insChecks,#edChecks{list-style:none;padding:0;margin:8px 0 0;font-size:12px}#insChecks li,#edChecks li{padding:3px 0 3px 20px;position:relative;line-height:1.45}#insChecks li:before,#edChecks li:before{position:absolute;left:0;font-weight:700}#insChecks li.ok:before,#edChecks li.ok:before{content:"✓";color:var(--ok)}#insChecks li.warn:before,#edChecks li.warn:before{content:"⚠";color:var(--warn)}#insChecks li.error:before,#edChecks li.error:before{content:"✗";color:var(--bad)}#insChecks li.info:before,#edChecks li.info:before{content:"ℹ";color:var(--dim)}#insChecks li.info,#edChecks li.info{color:var(--dim)}.lbl.axis{font-size:11px;background:#0a0e14b3;border:none}.lbl.axis.axx{color:#ff6b6b}.lbl.axis.axy{color:#6ee86e}.lbl.axis.axz{color:#6aa0ff}.lbl.axis.origin{color:#fff;transform:translate(10px,4px)}.lbl.conn{font-size:11px;font-weight:400;color:#ffd23f;border-color:#ffd23f99;background:#0a0e14bf;transform:translate(8px,-120%)}.lbl.tag{color:var(--acc2);border-color:var(--acc2)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%);z-index:50;background:var(--panel);border:1px solid var(--acc2);padding:8px 16px;font-size:13px}.toast.bad{border-color:var(--bad)}.hint.axes b{font-weight:700}.ax-x{color:#ff6b6b}.ax-y{color:#6ee86e}.ax-z{color:#6aa0ff}#insJoints .jrow{border:1px solid var(--line, #2a3644);border-radius:6px;padding:6px 8px;margin:6px 0}#insJoints .jrow.sel{border-color:#ffd23f;box-shadow:0 0 0 1px #ffd23f59}#insJoints .jhead{display:flex;align-items:center;gap:6px;margin-bottom:4px}#insJoints .jhead b{color:#ffd23f}#insJoints .jsrc{flex:1}#insJoints .jsrc.mod{color:#ffb020}#insJoints .jhead button{padding:2px 8px;font-size:12px}#insJoints .jgrid{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:4px 6px;align-items:center;font-size:12px}#insJoints .jgrid label{display:flex;align-items:center;gap:3px}#insJoints .jgrid i{font-style:normal;font-weight:700}#insJoints .jgrid input{width:100%;min-width:0;padding:2px 4px;font-size:12px}#tabs button.wsTab{margin-left:auto;color:var(--acc2)}#workshop,#editor{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;background:var(--bg)}#workshop[hidden],#editor[hidden]{display:none}.wsTop{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}.wsTop b{color:var(--acc);font-size:16px;letter-spacing:.05em}.wsTop .sp{flex:1}.small{font-size:12px}.wsBody{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 360px}#wsLeft,#edLeft,#wsRight,#edRight{overflow-y:auto;padding:8px 12px 20px;background:var(--panel)}#wsLeft,#edLeft{border-right:1px solid var(--line)}#wsRight,#edRight{border-left:1px solid var(--line)}#wsLeft h3,#edLeft h3,#wsRight h3,#edRight h3{font-size:13px;color:var(--acc2);margin:12px 0 6px}#wsLeft>select,#edLeft>select,.wsRow{width:100%;margin-bottom:6px}.wsRow{display:flex;gap:4px}.wsRow select,.wsRow input{flex:1;min-width:0}.wsSlot{border-top:1px solid var(--line);padding:6px 0}.wsSlot>label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim)}.wsSlot select{width:100%}.wsPiece{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:2px 0 2px 10px}.wsPiece.sel{color:#ffd23f}.wsPiece label{font-size:11px;color:var(--acc2)}#wsView,#edView{position:relative;min-width:0;min-height:0}#wsGl,#edGl{width:100%;height:100%;display:block}#wsLabels,#edLabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}#wsToolbar,#edToolbar{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}#wsToolbar>*,#edToolbar>*{pointer-events:auto}#wsAnimBar{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);padding:6px 8px}#wsAnimBar .btns{display:flex;flex-wrap:wrap;gap:4px}#wsAnimBar .btns button{padding:3px 8px;font-size:12px}.wsTime{display:flex;gap:8px;align-items:center;margin-top:6px}.wsTime input{flex:1}#wsTimeText{min-width:52px;font-size:12px;color:var(--dim)}.wsNode,.wsConn{padding:3px 4px 3px calc(var(--d) * 10px + 4px);font-size:12px;cursor:pointer;border-left:2px solid transparent}.wsNode{display:flex;flex-direction:column;margin-top:4px}.wsNode b{font-size:13px}.wsConn{display:flex;gap:6px;justify-content:space-between}.wsConn .cn{color:#ffd23f;white-space:nowrap}.wsConn .cv{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}.wsNode:hover,.wsConn:hover{background:#ffffff0a}.wsNode.sel,.wsConn.sel{border-left-color:#ffd23f;background:#ffd23f14}@media(max-width:1100px){.wsBody{grid-template-columns:230px minmax(0,1fr) 300px}}@media(max-width:860px){.wsBody{display:flex;flex-direction:column;overflow-y:auto}#wsView,#edView{flex:none;height:62vh;order:-1}#wsLeft,#edLeft,#wsRight,#edRight{overflow:visible;border:none;border-top:1px solid var(--line)}}#wsDetail,#edDetail{border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}.wsDh{display:flex;flex-direction:column}.wsDh b{color:#ffd23f;font-size:14px}.wsDf{display:flex;align-items:center;justify-content:space-between}.jsrc.mod,.wsConn.mod .cv{color:var(--warn)}.warnTxt{color:var(--acc2)}button.link{border:none;background:none;padding:0 4px;color:#ffd23f;text-decoration:underline}#wsDetail .jgrid,#edDetail .jgrid{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:4px 6px;align-items:center;font-size:12px}#wsDetail .jgrid label,#edDetail .jgrid label{display:flex;align-items:center;gap:3px}#wsDetail .jgrid i,#edDetail .jgrid i{font-style:normal;font-weight:700}#wsDetail .jgrid input,#edDetail .jgrid input{width:100%;min-width:0;padding:2px 4px;font-size:12px}.wsPiece{cursor:pointer}.wsPiece:hover{background:#ffffff0a}.wsTools button{background:var(--panel)}.lbl.conn.cur{color:#fff;border-color:#fff}#wsDetail,#edDetail{position:sticky;top:-8px;z-index:2;background:#11161d;box-shadow:0 6px 10px #00000059}.wsTools{display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:3px}.wsTools button{padding:3px 8px;font-size:12px}.wsTools label.tog{font-size:12px;padding:0 6px;display:flex;align-items:center;gap:4px}.wsSteps{background:var(--panel);border:1px solid var(--line);padding:4px 8px;font-size:12px;max-width:420px}.wsSteps summary{cursor:pointer}.wsStepGrid{display:grid;grid-template-columns:repeat(2,auto);gap:4px 10px;margin-top:6px;justify-content:start}.wsStepGrid label{display:flex;align-items:center;gap:3px}.wsStepGrid input[type=number]{width:64px;padding:2px 4px}.wsStepGrid label.tog{grid-column:1 / -1;padding:0}.wsWarn{font-size:12px;color:#ff8a7a;padding:3px 4px;cursor:pointer}.wsWarn:hover{background:#ff5a4d1a}.ok{color:var(--ok)}#wsChecks{display:flex;flex-direction:column;gap:2px}#tabs button.edTab{margin-left:4px}#edLeft>select{width:100%;margin-bottom:6px}#edLeft .btns,#edRight .btns{display:flex;flex-wrap:wrap;gap:4px}.edRow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px;font-size:12px}.edRow label{display:flex;align-items:center;gap:3px}.edRow input[type=number]{width:64px;padding:2px 4px}#edOrigin button.sel,#edPick.sel{border-color:#ffd23f;color:#ffd23f}.edNode{display:flex;align-items:center;gap:4px;padding:2px 4px 2px calc(var(--d) * 10px + 4px);font-size:12px;cursor:pointer;border-left:2px solid transparent}.edNode .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.edNode b{flex:1}.edNode:hover{background:#ffffff0a}.edNode.sel{border-left-color:#ffd23f;background:#ffd23f14}.edNode.off .nm{opacity:.45;text-decoration:line-through}button.mini{padding:0 5px;font-size:11px;line-height:18px}.edName{display:flex;gap:6px;align-items:center;font-size:12px}.edName input{flex:1;min-width:0}#edStats .warn{color:var(--warn)}#edStats .error{color:var(--bad)}.edBoxSel{position:absolute;border:1px dashed #ffd23f;background:#ffd23f1f;pointer-events:none}.edBoxSel[hidden]{display:none}#edAsm label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--dim);margin-bottom:4px}#edAsm select{width:100%}.edPc{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 4px;cursor:pointer;border-left:2px solid transparent}.edPc i{width:10px;height:10px;flex:none}.edPc .nm{flex:1}.edPc.sel{border-left-color:#ffd23f;background:#ffd23f14}.edPc.off .nm{opacity:.45}.edPc .warn{color:var(--warn)}.edPc .error{color:var(--bad)}.edSlider{display:grid;grid-template-columns:70px 1fr 42px;align-items:center;gap:6px;font-size:12px}#edSplitRight .btns{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}#edSplitRight button.sel{border-color:#ffd23f;color:#ffd23f}button.primary{border-color:var(--acc);color:var(--acc)}#edSplitOn.sel{border-color:#ffd23f;color:#ffd23f}.edMat{font-size:12px;border-left:2px solid transparent}.edMat summary{display:flex;align-items:center;gap:6px;cursor:pointer;padding:2px 4px}.edMat summary i,.edCl i{width:12px;height:12px;flex:none;border:1px solid var(--line)}.edMat .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.edMat[open]{border-left-color:#ffd23f;background:#ffffff08}.edMat label{display:flex;align-items:center;gap:6px;padding:2px 4px 2px 22px}.edMat label input[type=range],.edMat label select{flex:1;min-width:0}.edCl{display:flex;align-items:center;gap:6px;margin:3px 0}.edCl .small{min-width:96px}.edCl select{flex:1;min-width:0}#edMatBox.sel{border-color:#ffd23f;color:#ffd23f}#edClusterK{width:44px}#edMatTools[hidden]{display:none}
</style>
  </head>
  <body>
    <canvas id="gridGl"></canvas>
    <header id="top">
      <div class="brand">
        <b>RUBICON</b> 模型庫
        <span class="dim" id="count"></span>
      </div>
      <div class="tools">
        <input id="search" type="search" placeholder="搜尋名稱或編號…" />
        <label
          >配色
          <select id="palSel"></select
        ></label>
        <label
          >來源
          <select id="srcSel">
            <option value="">全部</option>
            <option value="glb">只看 GLB</option>
            <option value="proc">只看程式模型</option>
          </select></label
        >
        <button id="btnManifest" title="匯出所有 GLB 槽位與檢查結果">匯出對照表</button>
        <button
          id="btnJoints"
          title="匯出連接點設定（內建＋這個瀏覽器的修改），放到 src/assets/models/joints.json"
        >
          匯出關節設定
        </button>
        <span class="dim hint">把 .glb 拖到任一格即可替換（存在這個瀏覽器）</span>
        <span class="dim hint axes"
          >原點與三軸：<b class="ax-x">X</b>　<b class="ax-y">Y 上</b>　<b class="ax-z">Z 正面</b></span
        >
      </div>
      <nav id="tabs"></nav>
    </header>
    <main id="grid"></main>

    <section id="workshop" hidden>
      <header class="wsTop">
        <b>組裝調整</b>
        <span class="dim small" id="wsInfo"></span>
        <span class="sp"></span>
        <button id="wsBack" title="回到格狀檢視（Esc）">← 回模型庫</button>
      </header>
      <div class="wsBody">
        <aside id="wsLeft">
          <h3>預組</h3>
          <select id="wsFrom"></select>
          <div class="wsRow">
            <select id="wsPresets"></select
            ><button id="wsLoadPreset">載入</button><button id="wsDelPreset">刪除</button>
          </div>
          <div class="wsRow">
            <input id="wsPresetName" placeholder="預組名稱" maxlength="40" /><button id="wsSavePreset">
              儲存
            </button>
          </div>
          <div class="wsRow">
            <button id="wsExport">匯出預組</button><button id="wsImport">匯入預組…</button>
            <input id="wsImportFile" type="file" accept=".json,application/json" hidden />
          </div>
          <h3>零件</h3>
          <div id="wsParts"></div>
        </aside>
        <div id="wsView">
          <canvas id="wsGl"></canvas>
          <div id="wsLabels"></div>
          <div id="wsToolbar"></div>
          <div id="wsAnimBar">
            <div class="btns" id="wsAnims"></div>
            <div class="wsTime">
              <button id="wsPlay"></button>
              <input type="range" id="wsTime" min="0" max="4" step="0.01" />
              <span id="wsTimeText"></span>
            </div>
          </div>
        </div>
        <aside id="wsRight">
          <h3>選取</h3>
          <div id="wsDetail"></div>
          <h3>穿幫提示</h3>
          <div id="wsChecks"></div>
          <h3>組裝層級與連接點</h3>
          <div id="wsTree"></div>
        </aside>
      </div>
    </section>

    <section id="editor" class="edPage" hidden>
      <header class="wsTop">
        <b>GLB 編輯</b>
        <span class="dim small" id="edInfo"></span>
        <span class="sp"></span>
        <button id="edBack" title="回到格狀檢視（Esc）">← 回模型庫</button>
      </header>
      <div class="wsBody">
        <aside id="edLeft">
          <div id="edSlotBox">
            <h3>目標槽位</h3>
            <select id="edSlot"></select>
            <div id="edSpec"></div>
          </div>
          <h3>檔案</h3>
          <div class="btns">
            <button id="edOpen" title="也可以直接把 .glb 拖到畫面上">開啟 GLB…</button>
            <button id="edFromSlot" title="載入這個槽位目前的 GLB（瀏覽器暫存或內建）">載入槽位的 GLB</button>
            <button id="edAdd" title="另一個 GLB 加入成新節點（例如另外生成的肩甲、配件）">加入 GLB…</button>
            <input id="edAddFile" type="file" accept=".glb,model/gltf-binary" hidden />
            <button id="edRevert" title="放棄所有修改，回到最初匯入的檔案">還原原始檔</button>
            <input id="edFile" type="file" accept=".glb,model/gltf-binary" hidden />
          </div>
          <div class="dim small" id="edSrc"></div>
          <h3>拆分</h3>
          <div class="btns">
            <button id="edSplitOn" title="把整台機甲或整隻手臂拆成遊戲的各個區塊">拆分成區塊…</button>
          </div>
          <div id="edSplitLeft" hidden>
            <div class="dim small">零件組合（拆出的區塊存進這些零件的槽位）</div>
            <div id="edAsm"></div>
            <div class="dim small">區塊（勾選＝參與分配）</div>
            <div id="edPieces"></div>
          </div>
          <div id="edTreeBox">
            <h3>節點</h3>
            <div id="edTree"></div>
            <h3>材質</h3>
            <div id="edMats"></div>
          </div>
        </aside>
        <div id="edView">
          <canvas id="edGl"></canvas>
          <div id="edLabels"></div>
          <div id="edToolbar"></div>
        </div>
        <aside id="edRight">
          <div id="edSplitRight" hidden></div>
          <div id="edMain">
            <h3>選取</h3>
            <div id="edDetail"></div>
            <h3>朝向</h3>
            <div class="edRow">
              <label
                >正面是
                <select id="edFront"></select
              ></label>
              <label
                >上方是
                <select id="edUp"></select
              ></label>
              <button id="edOrient" title="轉成規格的 +Z 正面、+Y 上方">套用</button>
            </div>
            <div class="btns" id="edRot">
              <button data-ax="x" data-deg="90">X +90°</button
              ><button data-ax="x" data-deg="-90">X −90°</button>
              <button data-ax="y" data-deg="90">Y +90°</button
              ><button data-ax="y" data-deg="-90">Y −90°</button>
              <button data-ax="z" data-deg="90">Z +90°</button
              ><button data-ax="z" data-deg="-90">Z −90°</button>
              <button id="edMirror" title="沿 X 軸左右翻轉（例如把左手改成右手）">左右翻轉</button>
            </div>
            <h3>尺寸</h3>
            <div class="edRow">
              <select id="edFitMode"></select
              ><select id="edAnchor"></select>
              <button id="edFit" title="等比縮放並移到程式模型的外框">對齊程式模型</button>
            </div>
            <div class="edRow">

              </div>
            </div>
          </div>
