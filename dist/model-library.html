  <body>
    <canvas id="gridGl"></canvas>
    <header id="top">
      <div class="brand">
        <b>RUBICON</b> 模型庫
        <span class="dim" id="count"></span>
      </div>
      <div class="tools">
        <input id="search" type="search" placeholder="搜尋名稱或編號…" />
        <label
          >配色
          <select id="palSel"></select
        ></label>
        <label
          >來源
          <select id="srcSel">
            <option value="">全部</option>
            <option value="glb">只看 GLB</option>
            <option value="proc">只看程式模型</option>
          </select></label
        >
        <button id="btnManifest" title="匯出所有 GLB 槽位與檢查結果">匯出對照表</button>
        <button
          id="btnJoints"
          title="匯出連接點設定（內建＋這個瀏覽器的修改），放到 src/assets/models/joints.json"
        >
          匯出關節設定
        </button>
        <span class="dim hint">把 .glb 拖到任一格即可替換（存在這個瀏覽器）</span>
        <span class="dim hint axes"
          >原點與三軸：<b class="ax-x">X</b>　<b class="ax-y">Y 上</b>　<b class="ax-z">Z 正面</b></span
        >
      </div>
      <nav id="tabs"></nav>
    </header>
    <main id="grid"></main>

    <section id="workshop" hidden>
      <header class="wsTop">
        <b>組裝調整</b>
        <span class="dim small" id="wsInfo"></span>
        <span class="sp"></span>
        <button id="wsBack" title="回到格狀檢視（Esc）">← 回模型庫</button>
      </header>
      <div class="wsBody">
        <aside id="wsLeft">
          <h3>預組</h3>
          <select id="wsFrom"></select>
          <div class="wsRow">
            <select id="wsPresets"></select
            ><button id="wsLoadPreset">載入</button><button id="wsDelPreset">刪除</button>
          </div>
          <div class="wsRow">
            <input id="wsPresetName" placeholder="預組名稱" maxlength="40" /><button id="wsSavePreset">
              儲存
            </button>
          </div>
          <div class="wsRow">
            <button id="wsExport">匯出預組</button><button id="wsImport">匯入預組…</button>
            <input id="wsImportFile" type="file" accept=".json,application/json" hidden />
          </div>
          <h3>零件</h3>
          <div id="wsParts"></div>
        </aside>
        <div id="wsView">
          <canvas id="wsGl"></canvas>
          <div id="wsLabels"></div>
          <div id="wsToolbar"></div>
          <div id="wsAnimBar">
            <div class="btns" id="wsAnims"></div>
            <div class="wsTime">
              <button id="wsPlay"></button>
              <input type="range" id="wsTime" min="0" max="4" step="0.01" />
              <span id="wsTimeText"></span>
            </div>
          </div>
        </div>
        <aside id="wsRight">
          <h3>連接點</h3>
          <div id="wsTree"></div>
        </aside>
      </div>
    </section>

    <div id="inspect" hidden>
      <div id="insView">
        <canvas id="insGl"></canvas>
        <div id="insLabels"></div>
        <button id="insClose" title="關閉（Esc）">✕</button>
      </div>
      <aside id="insSide">
        <h2 id="insName"></h2>
        <div class="dim" id="insId"></div>
        <div id="insInfo"></div>
        <h3>模式</h3>
        <div class="btns" id="insModes"></div>
        <h3>GLB</h3>
        <div class="btns">
          <button id="insLoad">載入 GLB…</button>
          <button id="insDownload">下載（依槽位命名）</button>
          <button id="insRemove">移除瀏覽器暫存</button>
          <button id="insTemplate" title="把程式模型照規格匯出成 GLB，當作建模範本">下載範本 GLB</button>
          <input id="insFile" type="file" accept=".glb,model/gltf-binary" hidden />
        </div>
        <div class="dim small" id="insGlbHint"></div>
        <ul id="insChecks"></ul>
        <h3 id="insJointH">關節設定（連接點）</h3>
        <div id="insJoints"></div>
        <div class="btns" id="insJointBtns">
          <button id="insJointsExport">匯出關節設定（joints.json）</button>
        </div>
        <h3>顯示</h3>
        <div class="toggles" id="insToggles"></div>
        <div class="row2">
          <label
            >配色
            <select id="insPal"></select
          ></label>
          <label
            >光線
            <select id="insLight"></select
          ></label>
        </div>
        <h3 id="insAnimH">動作預覽</h3>
        <div class="btns" id="insAnims"></div>
      </aside>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/SSAOShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/math/SimplexNoise.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/SSAOPass.js"></script>
